<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#071320" />
<title>登录 · PLNL 家庭私有云</title>
<style>
/* ============================================================
   PLNL Mail Login — 设计基准版（可独立打开预览）
   设计令牌：深空夜景 + 玻璃拟态卡片 + 中文衬线标题
   对比度：正文 ≥ 4.5:1，标题 ≥ 3:1（WCAG AA）
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
:root{
  /* 色板 */
  --sky-top:#050d16;
  --sky-mid:#0a1a27;
  --sky-low:#16232c;
  --horizon:#3c3830;
  --ink:#eef4f9;
  --ink-soft:#b6c8d7;
  --ink-mute:#8ba0b2;
  --accent:#8ec6ea;
  --accent-deep:#3f7fac;
  --line:rgba(163,192,214,.16);
  --line-strong:rgba(170,200,224,.28);

  /* 玻璃卡片 */
  --card-bg:linear-gradient(168deg, rgba(28,47,64,.72) 0%, rgba(9,20,30,.88) 100%);
  --card-edge:rgba(168,199,224,.20);
  --card-shadow:0 40px 80px -32px rgba(0,0,0,.85), 0 2px 8px rgba(0,0,0,.35);

  /* 尺寸节奏（4pt 基准） */
  --r-sm:10px;
  --r-md:12px;
  --r-lg:18px;
  --r-full:999px;

  /* 字体 */
  --sans:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}

html,body{height:100%}
body{
  margin:0;
  min-height:100%;
  font-family:var(--sans);
  color:var(--ink);
  background:var(--sky-top);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

/* ---------- 场景底层 ---------- */
.scene{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}

.sky{
  position:absolute;inset:0;
  background:
    radial-gradient(64% 26% at 62% 72%, rgba(246,198,146,.26) 0%, rgba(198,152,108,.07) 55%, transparent 76%),
    radial-gradient(60% 40% at 14% 70%, rgba(126,164,196,.10) 0%, transparent 74%),
    linear-gradient(180deg,
      #05131f 0%,
      #07202f 16%,
      #0a2738 30%,
      #0f3143 42%,
      #1a3d4d 53%,
      #2c4955 62%,
      #46525a 68%,
      #7d6f57 73%,
      #96805e 76%,
      #6a5c45 82%,
      #3a3428 92%,
      #262219 100%);
}
/* 星点：手工排布，避免规律网格感 */
.sky::before{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 14%, rgba(255,255,255,.95), transparent 60%),
    radial-gradient(1.2px 1.2px at 22% 8%, rgba(255,255,255,.65), transparent 60%),
    radial-gradient(1.1px 1.1px at 31% 21%, rgba(255,255,255,.75), transparent 60%),
    radial-gradient(1.8px 1.8px at 44% 11%, rgba(255,255,255,.9), transparent 60%),
    radial-gradient(1.1px 1.1px at 52% 25%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.3px 1.3px at 61% 7%,  rgba(255,255,255,.8), transparent 60%),
    radial-gradient(1.1px 1.1px at 69% 18%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.9px 1.9px at 78% 9%,  rgba(255,255,255,.92), transparent 60%),
    radial-gradient(1.2px 1.2px at 86% 22%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1.1px 1.1px at 94% 13%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.3px 1.3px at 8% 33%,  rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.1px 1.1px at 18% 42%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.4px 1.4px at 26% 36%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.1px 1.1px at 36% 46%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 47% 38%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.1px 1.1px at 56% 44%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.2px 1.2px at 64% 34%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.1px 1.1px at 72% 45%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.4px 1.4px at 83% 38%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.1px 1.1px at 91% 47%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(2.2px 2.2px at 4% 22%, rgba(255,255,255,.85), transparent 60%),
    radial-gradient(1.6px 1.6px at 38% 5%, rgba(255,255,255,.75), transparent 60%);
  opacity:.95;
  animation:twinkle 9s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.68}to{opacity:1}}

/* 淡月光 + 冷色大气散光 */
.moon{
  position:absolute;left:26%;top:14%;
  width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%, rgba(252,246,232,.95), rgba(228,210,182,.55) 62%, rgba(228,210,182,0) 74%);
  box-shadow:0 0 22px 6px rgba(248,236,214,.14), 0 0 70px 26px rgba(200,216,236,.07);
  opacity:.5;
}
.glow{
  position:absolute;left:-10%;top:-18%;width:70%;height:70%;
  background:radial-gradient(circle at 50% 50%, rgba(96,150,196,.16), transparent 62%);
  filter:blur(10px);
}

/* ---------- 山脊（内联 SVG，曲线比多边形更接近照片） ---------- */
.ridges{
  position:absolute;left:-2%;right:-2%;bottom:0;
  width:104%;height:36vh;
  display:block;
}
.ridges .r-far{filter:blur(2.6px)}
.ridges .r-mid{filter:blur(1.5px)}
.ridges .r-near{filter:blur(.6px)}
/* 地平线暖雾，让山脊与天空之间不硬接 */
.haze{
  position:absolute;left:0;right:0;bottom:6vh;height:46vh;
  background:linear-gradient(180deg, rgba(248,214,176,0) 0%, rgba(248,214,176,.04) 48%, rgba(248,214,176,.075) 100%);
  pointer-events:none;
}
/* 底部压暗，保证页脚可读 */
.vignette{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg, rgba(3,9,15,.42) 0%, transparent 26%),
    linear-gradient(90deg, rgba(3,10,17,.5) 0%, rgba(3,10,17,.12) 34%, transparent 58%),
    linear-gradient(0deg, rgba(2,6,10,.5) 0%, transparent 16%);
}

/* ---------- 顶部栏 ---------- */
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:24px;padding:22px clamp(20px,3.4vw,52px);
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand-mark{
  width:34px;height:34px;border-radius:9px;flex:none;
  display:grid;place-items:center;
  background:linear-gradient(165deg,#bfe4fa 0%,#5f9fc9 42%,#24506e 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 6px 16px -8px rgba(120,180,225,.7);
}
.brand-mark svg{width:19px;height:19px;color:#08202f}
.brand-text{display:flex;flex-direction:column;gap:3px;line-height:1}
.brand-word{
  font-size:13px;font-weight:600;letter-spacing:.42em;color:#eaf3fa;
}
.brand-sub{
  font-size:8px;letter-spacing:.32em;color:var(--ink-mute);font-weight:500;
}
.topbar-right{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--ink-soft)}
.topbar-right .link{color:var(--ink-soft);text-decoration:none;transition:color .2s var(--ease)}
.topbar-right .link:hover{color:#fff}
.topbar-right .sep{color:rgba(163,192,214,.3)}
.icon-btn{
  width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.10);
  color:var(--ink-soft);
  cursor:pointer;
  transition:background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease);
}
.icon-btn:hover{background:rgba(255,255,255,.13);color:#fff;border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn svg{width:14px;height:14px}

/* ---------- 主区 ---------- */
.main{
  flex:1;
  display:flex;align-items:center;justify-content:space-between;
  gap:clamp(32px,5vw,80px);
  width:100%;max-width:1180px;margin:0 auto;
  padding:clamp(24px,4vh,56px) clamp(20px,3.4vw,52px) clamp(56px,9vh,120px);
}

/* 左侧文案 */
.hero{max-width:520px;position:relative;animation:riseIn .9s var(--ease) both}
.hero::before{
  content:"";position:absolute;left:-26px;top:8px;bottom:14px;width:1px;
  background:linear-gradient(180deg, transparent, rgba(180,214,236,.28) 18%, rgba(180,214,236,.06) 70%, transparent);
}
.eyebrow{
  display:flex;align-items:center;gap:12px;
  font-size:11px;letter-spacing:.3em;color:#a9c2d5;text-transform:uppercase;
  margin-bottom:26px;
}
.eyebrow .rule{width:34px;height:1px;background:rgba(180,214,236,.5)}
h1{
  margin:0 0 22px;
  font-family:var(--serif);
  font-weight:500;
  font-size:clamp(38px,4.7vw,66px);
  line-height:1.24;
  letter-spacing:.08em;
  color:#f4f9fd;
  text-shadow:0 2px 30px rgba(4,12,20,.55);
}
.hero-sub{
  margin:0 0 30px;
  font-size:14.5px;line-height:1.9;letter-spacing:.06em;
  color:#c3d4e2;
  max-width:26em;
}
.meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:0;
  margin:0;padding:0;list-style:none;
  font-size:11.5px;letter-spacing:.14em;color:#8fa7b9;
}
.meta li{display:flex;align-items:center}
.meta li+li::before{
  content:"";width:1px;height:10px;margin:0 14px;
  background:rgba(150,180,205,.32);
}

/* 右侧登录卡片 */
.card{
  flex:none;width:382px;
  padding:26px 26px 22px;
  border-radius:var(--r-lg);
  background:var(--card-bg);
  border:1px solid var(--card-edge);
  box-shadow:var(--card-shadow), inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(22px) saturate(130%);
  -webkit-backdrop-filter:blur(22px) saturate(130%);
  animation:riseIn 1s var(--ease) .12s both;
}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.card-eyebrow{
  display:flex;align-items:center;gap:8px;
  font-size:9.5px;letter-spacing:.26em;color:#9db6c9;text-transform:uppercase;
  margin-bottom:14px;
}
.card-eyebrow .dot{
  width:5px;height:5px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px 1px rgba(142,198,234,.8);
}
.card h2{
  margin:0 0 6px;
  font-size:22px;font-weight:600;letter-spacing:.04em;color:#f6fafd;
}
.card-sub{
  margin:0 0 22px;
  font-size:12px;line-height:1.7;letter-spacing:.03em;color:#93a9ba;
}

.field{margin-bottom:16px}
.field label{
  display:flex;align-items:center;gap:5px;
  font-size:11.5px;letter-spacing:.1em;color:#b6c9d8;margin-bottom:8px;
}
.field label .req{color:#8ec6ea}
.control{position:relative;display:flex;align-items:center}
.control .lead{
  position:absolute;left:12px;display:grid;place-items:center;
  color:#7d97aa;pointer-events:none;transition:color .2s var(--ease);
}
.control .lead svg{width:15px;height:15px}
.control input{
  width:100%;height:44px;
  padding:0 40px 0 38px;
  font:inherit;font-size:13.5px;letter-spacing:.02em;
  color:#eaf3fa;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.10);
  border-radius:var(--r-sm);
  transition:border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
  -webkit-appearance:none;appearance:none;
}
.control input::placeholder{color:#6c8395}
.control input:hover{background:rgba(255,255,255,.065)}
.control input:focus{
  outline:none;
  border-color:rgba(142,198,234,.62);
  background:rgba(255,255,255,.08);
  box-shadow:0 0 0 3.5px rgba(142,198,234,.14);
}
.control:focus-within .lead{color:var(--accent)}
.control input:-webkit-autofill{
  -webkit-text-fill-color:#eaf3fa;
  -webkit-box-shadow:0 0 0 1000px #0e2231 inset;
  caret-color:#eaf3fa;
}
.eye{
  position:absolute;right:8px;
  width:30px;height:30px;border-radius:8px;
  display:grid;place-items:center;
  background:transparent;border:0;color:#7d97aa;cursor:pointer;
  transition:color .2s var(--ease), background .2s var(--ease);
}
.eye:hover{color:#dbe9f4;background:rgba(255,255,255,.08)}
.eye:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.eye svg{width:15px;height:15px}

.error{
  display:none;align-items:center;gap:6px;
  margin:2px 0 12px;font-size:11.5px;letter-spacing:.02em;color:#f3a79f;
}
.error[data-show="true"]{display:flex}
.error svg{width:13px;height:13px;flex:none}

.submit{
  width:100%;height:44px;margin-top:6px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:inherit;font-size:13.5px;font-weight:600;letter-spacing:.22em;
  color:#08202f;
  background:linear-gradient(180deg,#f0f8fe 0%,#cfe6f6 100%);
  border:1px solid rgba(255,255,255,.7);
  border-radius:var(--r-sm);
  cursor:pointer;
  box-shadow:0 8px 24px -12px rgba(160,205,235,.9), inset 0 1px 0 #fff;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease), filter .18s var(--ease);
}
.submit:hover{transform:translateY(-1px);filter:brightness(1.03);box-shadow:0 12px 28px -12px rgba(160,205,235,1), inset 0 1px 0 #fff}
.submit:active{transform:translateY(0);filter:brightness(.98)}
.submit:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.submit[data-busy="true"]{opacity:.75;cursor:progress}

.card-note{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin:16px 0 0;
  font-size:10.5px;letter-spacing:.06em;color:#7e96a8;
}
.card-note svg{width:12px;height:12px;flex:none;opacity:.85}

.toast{
  position:fixed;left:50%;bottom:32px;transform:translate(-50%,16px);
  padding:11px 20px;border-radius:var(--r-full);
  background:rgba(12,26,38,.92);
  border:1px solid var(--line-strong);
  box-shadow:0 18px 40px -18px rgba(0,0,0,.9);
  font-size:12.5px;letter-spacing:.04em;color:#dceaf5;
  opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease), transform .3s var(--ease);
  z-index:20;
}
.toast[data-show="true"]{opacity:1;transform:translate(-50%,0)}

/* ---------- 页脚 ---------- */
.foot{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 clamp(20px,3.4vw,52px) 20px;
  font-size:10.5px;letter-spacing:.14em;color:#7a90a1;
}
.foot .right{color:#8aa1b3}

/* ---------- 响应式 ---------- */
@media (max-width:1023px){
  .main{flex-direction:column;justify-content:center;gap:36px;text-align:center;padding-bottom:clamp(72px,14vh,120px)}
  .hero{max-width:560px}
  .hero::before{display:none}
  .eyebrow{justify-content:center}
  h1{font-size:clamp(34px,7vw,52px)}
  .hero-sub{margin-inline:auto}
  .meta{justify-content:center}
  .card{width:min(100%,400px);text-align:left}
  .topbar-right .link,.topbar-right .sep,.topbar-right .server{display:none}
}
@media (max-width:640px){
  .topbar{padding:18px 20px}
  .brand-word{font-size:12px;letter-spacing:.34em}
  .main{padding-top:8px;gap:28px}
  .eyebrow{margin-bottom:16px;font-size:10px}
  h1{margin-bottom:14px;letter-spacing:.06em}
  .hero-sub{font-size:13px;margin-bottom:20px}
  .meta{font-size:10.5px}
  .meta li+li::before{margin:0 10px}
  .card{padding:22px 20px 18px}
  .card h2{font-size:20px}
  .foot{flex-direction:column;gap:8px;padding-bottom:16px;text-align:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-height:620px) and (min-width:1024px){
  .main{padding-top:12px;padding-bottom:40px}
  h1{font-size:clamp(32px,3.6vw,48px)}
  .eyebrow{margin-bottom:14px}
  .hero-sub{margin-bottom:18px}
}
</style>
</head>
<body>

<!-- ========== 场景 ========== -->
<div class="scene" aria-hidden="true">
  <div class="sky"></div>
  <div class="glow"></div>
  <div class="moon"></div>
  <div class="haze"></div>
  <svg class="ridges" viewBox="0 0 1440 420" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="rgFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5d5b5c"/>
        <stop offset="6%" stop-color="#3d4650"/>
        <stop offset="35%" stop-color="#262f38"/>
        <stop offset="68%" stop-color="#151d24"/>
        <stop offset="100%" stop-color="#0d141a"/>
      </linearGradient>
      <linearGradient id="rgMid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#232c35"/>
        <stop offset="45%" stop-color="#101820"/>
        <stop offset="100%" stop-color="#070c10"/>
      </linearGradient>
      <linearGradient id="rgNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0a1015"/>
        <stop offset="100%" stop-color="#020406"/>
      </linearGradient>
    </defs>

    <path class="r-mid" fill="url(#rgMid)" d="M0,330 L24,342 L78,326 L122,351 L147,336 L161,251 L202,243 L218,274 L271,288 L319,271 L374,290 L389,269 L410,244 L453,265 L492,262 L548,241 L623,269 L649,260 L697,281 L739,291 L784,262 L803,299 L817,331 L845,330 L894,303 L919,312 L954,314 L983,267 L1008,287 L1032,322 L1088,335 L1112,294 L1148,309 L1204,304 L1228,325 L1268,346 L1285,308 L1315,276 L1355,297 L1373,282 L1396,313 L1413,343 L1440,281 L1440,420 L0,420 Z"/>
    <path class="r-near" fill="url(#rgNear)" d="M0,372 L49,351 L84,355 L125,341 L172,346 L227,335 L241,331 L286,335 L350,339 L368,356 L387,332 L409,360 L454,375 L470,396 L516,359 L537,385 L557,346 L583,334 L634,337 L685,340 L704,332 L719,366 L772,390 L818,370 L866,390 L905,398 L952,391 L1000,393 L1052,394 L1072,363 L1124,372 L1167,383 L1181,402 L1201,394 L1249,403 L1278,399 L1299,363 L1339,331 L1364,337 L1398,373 L1418,402 L1440,392 L1440,420 L0,420 Z"/>
  </svg>
  <div class="vignette"></div>
</div>

<div class="page">

  <!-- 顶部栏 -->
  <header class="topbar">
    <a class="brand" href="/" aria-label="PLNL 首页">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 17.5 9 9.5l3.4 4.6L15 11l6 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="8.2" cy="6.4" r="1.6" fill="currentColor" opacity=".9"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-word">PLNL</span>
        <span class="brand-sub">PERSONAL CONSOLE</span>
      </span>
    </a>

    <div class="topbar-right">
      <a class="link" href="#">个人后台</a>
      <span class="sep" aria-hidden="true">|</span>
      <span class="server">PLNL Server Monitor</span>
      <button class="icon-btn" type="button" aria-label="切换语言">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.2 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.2-3.6-8.5S9.6 5.8 12 3.5Z"/>
        </svg>
      </button>
      <button class="icon-btn" type="button" aria-label="外观">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 主区 -->
  <main class="main">
    <section class="hero">
      <p class="eyebrow"><span class="rule" aria-hidden="true"></span>PLNL 家庭私有云</p>
      <h1>山高水长<br>守护如一</h1>
      <p class="hero-sub">山在这里，水在这里，家也在这里。</p>
      <ul class="meta">
        <li>实时状态监控</li>
        <li>异常告警通知</li>
        <li>最高安全设置</li>
      </ul>
    </section>

    <section class="card" aria-labelledby="card-title">
      <p class="card-eyebrow"><span class="dot" aria-hidden="true"></span>家庭控制台 · FAMILY CONSOLE</p>
      <h2 id="card-title">欢迎回来</h2>
      <p class="card-sub">请登录以进入 PLNL Server Monitor</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="account">账号 <span class="req" aria-hidden="true">*</span></label>
          <div class="control">
            <span class="lead" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="8.2" r="3.6"/><path d="M4.8 20c.9-3.6 3.7-5.6 7.2-5.6s6.3 2 7.2 5.6" stroke-linecap="round"/>
              </svg>
            </span>
            <input id="account" name="account" type="text" inputmode="email" autocomplete="username"
                   placeholder="admin@plnl.vip" required aria-describedby="form-error" />
          </div>
        </div>

        <div class="field">
          <label for="password">密码 <span class="req" aria-hidden="true">*</span></label>
          <div class="control">
            <span class="lead" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="4.5" y="10" width="15" height="10" rx="2.2"/><path d="M8.3 10V7.6a3.7 3.7 0 1 1 7.4 0V10" stroke-linecap="round"/>
              </svg>
            </span>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   placeholder="请输入密码" required aria-describedby="form-error" />
            <button class="eye" type="button" id="toggle-pw" aria-label="显示密码" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" id="eye-icon">
                <path d="M2.5 12S6.2 6.4 12 6.4 21.5 12 21.5 12 17.8 17.6 12 17.6 2.5 12 2.5 12Z"/>
                <circle cx="12" cy="12" r="2.9"/>
              </svg>
            </button>
          </div>
        </div>

        <p class="error" id="form-error" data-show="false" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.1" stroke-linecap="round"/>
          </svg>
          <span id="error-text">请输入账号与密码</span>
        </p>

        <button class="submit" type="submit" id="submit-btn">登 录</button>
      </form>

      <p class="card-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M12 3.4 19 6v6.1c0 4.1-2.9 7.3-7 8.5-4.1-1.2-7-4.4-7-8.5V6l7-2.6Z" stroke-linejoin="round"/>
        </svg>
        仅限授权人员访问 · 登录记录保存至本地
      </p>
    </section>
  </main>

  <footer class="foot">
    <span>PLNL Server Monitor · © 2026</span>
    <span class="right">守护 · 团结 · 友爱</span>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var form = document.getElementById('login-form');
  var account = document.getElementById('account');
  var password = document.getElementById('password');
  var error = document.getElementById('form-error');
  var errorText = document.getElementById('error-text');
  var toggle = document.getElementById('toggle-pw');
  var eyeIcon = document.getElementById('eye-icon');
  var submit = document.getElementById('submit-btn');
  var toast = document.getElementById('toast');
  var toastTimer;

  var EYE_OPEN = '<path d="M2.5 12S6.2 6.4 12 6.4 21.5 12 21.5 12 17.8 17.6 12 17.6 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.9"/>';
  var EYE_OFF = '<path d="M3 3l18 18" stroke-linecap="round"/><path d="M10.6 6.6A8.9 8.9 0 0 1 12 6.4c5.8 0 9.5 5.6 9.5 5.6a17 17 0 0 1-2.9 3.3M6.5 8.1A17 17 0 0 0 2.5 12S6.2 17.6 12 17.6c1 0 1.9-.2 2.8-.5" stroke-linecap="round"/>';

  toggle.addEventListener('click', function () {
    var show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    eyeIcon.innerHTML = show ? EYE_OFF : EYE_OPEN;
    password.focus();
  });

  function showToast(msg) {
    toast.textContent = msg;
    toast.dataset.show = 'true';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.dataset.show = 'false'; }, 3200);
  }

  function setError(msg) {
    if (!msg) { error.dataset.show = 'false'; account.removeAttribute('aria-invalid'); password.removeAttribute('aria-invalid'); return; }
    errorText.textContent = msg;
    error.dataset.show = 'true';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!account.value.trim()) { setError('请输入账号'); account.focus(); account.setAttribute('aria-invalid', 'true'); return; }
    if (!password.value) { setError('请输入密码'); password.focus(); password.setAttribute('aria-invalid', 'true'); return; }
    setError('');
    submit.dataset.busy = 'true';
    submit.textContent = '正在验证…';
    setTimeout(function () {
      submit.dataset.busy = 'false';
      submit.textContent = '登 录';
      showToast('设计预览：实际登录由 SmarterMail 处理');
    }, 700);
  });

  [account, password].forEach(function (el) {
    el.addEventListener('input', function () { if (error.dataset.show === 'true') setError(''); });
  });
})();
</script>
</body>
</html>
